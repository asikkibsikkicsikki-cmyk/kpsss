
name: KPSS Anki Studio - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 bileşenlerini kur
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android proje klasörünü bul
        shell: bash
        run: |
          ANDROID_DIR=""

          if [ -f "android/settings.gradle" ] && [ -f "android/app/build.gradle" ]; then
            ANDROID_DIR="android"

          elif [ -f "KPSS_Anki_Studio_Package/android/settings.gradle" ] && [ -f "KPSS_Anki_Studio_Package/android/app/build.gradle" ]; then
            ANDROID_DIR="KPSS_Anki_Studio_Package/android"

          elif [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            ANDROID_DIR="."

          else
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _android_source
              unzip -q "$ZIP_FILE" -d _android_source

              if [ -f "_android_source/KPSS_Anki_Studio_Package/android/settings.gradle" ]; then
                ANDROID_DIR="_android_source/KPSS_Anki_Studio_Package/android"
              fi
            fi
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "HATA: Android Gradle projesi bulunamadı."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Bulunan proje: $ANDROID_DIR"

      - name: APK derle
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ${{ env.ANDROID_DIR }}

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: KPSS-Anki-Studio-Android-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
