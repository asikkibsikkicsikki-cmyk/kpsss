
name: KPSS Anki Studio - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub deposundaki dosyaları indir
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      # 2. Java 17 kur
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK kur
      # ÖNEMLİ: Eski "tools" paketi kullanılmıyor.
      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Gerekli Android 35 bileşenlerini kur
      - name: Android SDK 35 bileşenlerini kur
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Gradle 8.7 kur
      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Android proje klasörünü bul
      - name: Android proje klasörünü bul
        shell: bash
        run: |
          ANDROID_DIR=""

          # Önce depodaki hazır klasörleri kontrol et
          if [ -f "android/settings.gradle" ] && [ -f "android/app/build.gradle" ]; then
            ANDROID_DIR="android"

          elif [ -f "KPSS_Anki_Studio_Package/android/settings.gradle" ] && [ -f "KPSS_Anki_Studio_Package/android/app/build.gradle" ]; then
            ANDROID_DIR="KPSS_Anki_Studio_Package/android"

          elif [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            ANDROID_DIR="."

          else
            echo "Hazır Android klasörü bulunamadı. ZIP dosyaları aranıyor..."

            ZIP_FILE=$(find . -type f -iname "*.zip" \
              -not -path "./.git/*" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _android_source
              unzip -q "$ZIP_FILE" -d _android_source
            fi

            # ZIP çıkarıldıktan sonra Gradle projesini bul
            SETTINGS_FILE=$(find . -type f -name "settings.gradle" \
              -not -path "./.git/*" \
              -not -path "./.gradle/*" | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              CANDIDATE_DIR=$(dirname "$SETTINGS_FILE")

              if [ -f "$CANDIDATE_DIR/app/build.gradle" ]; then
                ANDROID_DIR="$CANDIDATE_DIR"
              fi
            fi
          fi

          # Proje bulunamadıysa işlemi durdur
          if [ -z "$ANDROID_DIR" ]; then
            echo "::error::Android Gradle projesi bulunamadı."
            echo "settings.gradle ve app/build.gradle dosyalarını kontrol edin."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android proje klasörü bulundu: $ANDROID_DIR"

      # 7. Android APK oluştur
      - name: APK derle
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ${{ env.ANDROID_DIR }}

      # 8. APK dosyasının varlığını kontrol et
      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          APK_PATH="${ANDROID_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK dosyası oluşturulamadı: $APK_PATH"
            exit 1
          fi

          echo "APK başarıyla oluşturuldu."
          ls -lh "$APK_PATH"

      # 9. APK dosyasını indirilebilir hale getir
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: KPSS-Anki-Studio-Android-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
